<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Roommate Expense Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page" data-page="auth">
    <nav class="navbar">
      <div class="nav-left">
        <button
          class="menu-btn"
          id="menuToggle"
          type="button"
          aria-label="Open menu">
          ☰
        </button>
      </div>
      <div class="nav-center">
        <div class="brand">
          <div class="brand-logo-small">RM</div>
          <span>RoommateExpenses</span>
        </div>
      </div>
      <div class="nav-right">
        <button
          class="theme-toggle-btn"
          id="themeToggle"
          type="button"
          aria-label="Toggle theme">
          <span class="theme-icon">🌙</span>
        </button>
      </div>
    </nav>

    <aside class="sidebar" id="sidebar">
      <div class="brand-area">
        <div class="mini-logo">RM</div>
        <span>RoommateExpenses</span>
      </div>

      <div class="sidebar-profile">
        <span class="label">Guest Access</span>
        <div class="value">Login to continue</div>
      </div>

      <ul class="nav-links">
        <li><a href="index.html" class="active">🔐 Login</a></li>
        <!-- <li><a href="dashboard.html">📊 Dashboard</a></li>
        <li><a href="roommates.html">👥 Roommates</a></li>
        <li><a href="expenses.html">💰 Expenses</a></li> -->
      </ul>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="auth-card">
      <div class="auth-top">
        <div class="brand-logo">RM</div>
        <h1>Roommate Expenses</h1>
        <p>Track, split, and settle shared costs</p>
      </div>

      <div id="messageBar" class="message-bar hidden"></div>

      <form id="authForm">
        <div class="form-group">
          <label for="authUsername">Username</label>
          <input
            type="text"
            id="authUsername"
            class="form-control"
            placeholder="Enter username"
            required
            autocomplete="username" />
        </div>

        <div class="form-group">
          <label for="authPassword">Password</label>
          <input
            type="password"
            id="authPassword"
            class="form-control"
            placeholder="Enter password"
            required
            autocomplete="current-password" />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%">
          Login
        </button>
      </form>

      <p
        style="
          margin-top: 1rem;
          color: var(--text-muted);
          font-size: 0.88rem;
          text-align: center;
        ">
        Personal use only. Contact admin for credentials.
      </p>
    </main>
    <footer class="app-footer">
      <div class="footer-content">
        <span
          >© 2026 Powered by <strong>Ghouse</strong> •
          RoommateExpensesManager</span
        >
      </div>
    </footer>
    <script type="module" src="app.js"></script>
    <script type="module" src="auth.js"></script>
  </body>
</html>
